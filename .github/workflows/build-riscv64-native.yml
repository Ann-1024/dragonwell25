name: 'Build (linux-riscv64 native)'

on:
  push:
    branches:
      - 'pr/**'
  workflow_dispatch:
    inputs:
      make-target:
        description: 'Make target to build'
        required: true
        default: 'product-bundles test-bundles'
      configure-arguments:
        description: 'Additional configure arguments'
        required: false
      make-arguments:
        description: 'Additional make arguments'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04

    steps:
      - name: 'Checkout the scripts'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            make/conf/github-actions.conf

      - name: 'Build JTReg'
        uses: ./.github/actions/build-jtreg

  build-riscv64:
    name: build
    needs: prepare
    runs-on: ubuntu-24.04-riscv

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6

      - name: 'Show runner information'
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          cat /etc/os-release
          nproc
          df -h

      - name: 'Install toolchain and dependencies'
        run: |
          sudo apt-get update
          # RISE images provide liboss4-salsa-asound2, which conflicts with
          # the libasound2-dev headers required by the JDK build.
          sudo apt-get remove -y liboss4-salsa-asound2 || true
          sudo apt-get install --no-install-recommends -y \
            autoconf \
            gcc \
            g++ \
            libasound2-dev \
            libcups2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev \
            libxt-dev \
            libxtst-dev \
            make \
            unzip \
            wget \
            zip

      - name: 'Get the RISC-V BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-riscv64

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=linux-riscv64
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          --disable-precompiled-headers
          ${{ github.event.inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Build JDK'
        run: >
          make -k LOG=info
          ${{ github.event.inputs.make-target || 'product-bundles test-bundles' }}
          ${{ github.event.inputs.make-arguments }}

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: linux-riscv64

      - name: 'Verify native RISC-V output'
        run: |
          set -euxo pipefail
          test "$(uname -m)" = riscv64
          find build \( -type f -name hotspot -o -name libjvm.so \) | head -20

  test-riscv64:
    name: test
    needs:
      - prepare
      - build-riscv64
    uses: ./.github/workflows/test.yml
    with:
      platform: linux-riscv64
      bootjdk-platform: linux-riscv64
      runs-on: ubuntu-24.04-riscv
      dry-run: false
