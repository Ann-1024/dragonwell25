name: 'RISC-V Node and artifact diagnosis'

on:
  push:
    branches:
      - 'pr/riscv_node_artifact_diagnosis'

jobs:
  upload-v6:
    name: upload-v6
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    steps:
      - name: 'Show system Node'
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          command -v node || true
          node --version || true
          node -p 'process.execPath' || true
          node -p 'process.arch' || true
          printenv RUNNER_OS RUNNER_ARCH RUNNER_NAME RUNNER_VERSION 2>/dev/null || true

      - name: 'Create large upload test file'
        run: |
          set -euxo pipefail
          dd if=/dev/urandom of=large-upload-test.bin bs=1M count=256 status=progress
          sha256sum large-upload-test.bin

      - name: 'Upload with current artifact action v6'
        uses: actions/upload-artifact@v6
        with:
          name: riscv-large-upload-v6
          path: large-upload-test.bin
          compression-level: 0
          retention-days: 1

  upload-v5:
    name: upload-v5
    needs: upload-v6
    if: always()
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    steps:
      - name: 'Show system Node'
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          command -v node || true
          node --version || true
          node -p 'process.execPath' || true
          node -p 'process.arch' || true
          printenv RUNNER_OS RUNNER_ARCH RUNNER_NAME RUNNER_VERSION 2>/dev/null || true

      - name: 'Create large upload test file'
        run: |
          set -euxo pipefail
          dd if=/dev/urandom of=large-upload-test.bin bs=1M count=256 status=progress
          sha256sum large-upload-test.bin

      - name: 'Upload with downgraded artifact action v5'
        uses: actions/upload-artifact@v5
        with:
          name: riscv-large-upload-v5
          path: large-upload-test.bin
          compression-level: 0
          retention-days: 1

  upload-v6-multifile-compressed:
    name: upload-v6-multifile-compressed
    needs: upload-v5
    if: always()
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    steps:
      - name: 'Create three bundle-shaped files'
        run: |
          set -euxo pipefail
          mkdir bundle-test
          dd if=/dev/urandom of=bundle-test/jdk-linux-riscv64.tar.gz bs=1M count=80 status=progress
          dd if=/dev/urandom of=bundle-test/symbols-linux-riscv64.tar.gz bs=1M count=80 status=progress
          dd if=/dev/urandom of=bundle-test/tests-linux-riscv64.tar.gz bs=1M count=80 status=progress
          sha256sum bundle-test/*

      - name: 'Upload three files with v6 and compression level 6'
        uses: actions/upload-artifact@v6
        with:
          name: riscv-multifile-v6-compressed
          path: bundle-test
          compression-level: 6
          retention-days: 1

  upload-v6-multifile-uncompressed:
    name: upload-v6-multifile-uncompressed
    needs: upload-v6-multifile-compressed
    if: always()
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 30

    steps:
      - name: 'Create three bundle-shaped files'
        run: |
          set -euxo pipefail
          mkdir bundle-test
          dd if=/dev/urandom of=bundle-test/jdk-linux-riscv64.tar.gz bs=1M count=80 status=progress
          dd if=/dev/urandom of=bundle-test/symbols-linux-riscv64.tar.gz bs=1M count=80 status=progress
          dd if=/dev/urandom of=bundle-test/tests-linux-riscv64.tar.gz bs=1M count=80 status=progress
          sha256sum bundle-test/*

      - name: 'Upload three files with v6 and compression level 0'
        uses: actions/upload-artifact@v6
        with:
          name: riscv-multifile-v6-uncompressed
          path: bundle-test
          compression-level: 0
          retention-days: 1
